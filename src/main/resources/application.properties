spring.application.name=demo
spring.datasource.url=jdbc:h2:file:./data/demo
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Local frontend origins and session cookie settings.
frontend.origins=${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
server.servlet.session.cookie.name=session_id
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=24h
server.servlet.session.tracking-modes=cookie
